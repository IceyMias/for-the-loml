<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f3e8ff linear-gradient(#e9dcff,#fff0f7);font-family:Georgia,serif;color:#4a2470}
canvas{display:block;width:100%;height:100%}
#m,#s{position:fixed;left:0;right:0;margin:0;padding:0 24px;text-align:center;font-style:italic}
#m{top:10%;font-size:clamp(1.6rem,6vw,3rem);line-height:1.25;opacity:0;transition:opacity 2.5s}
#m.on{opacity:1}
#s{top:40%;transition:opacity 1s}
#s small{opacity:.6}
#n{width:min(320px,80%);background:none;border:0;border-bottom:2px solid #a855f7;font:inherit;font-size:1.5rem;text-align:center;color:inherit;outline:none;padding:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p id="m"></p>
<div id="s"><input id="n" placeholder="type your name" autofocus autocomplete="off" maxlength="24"><br><small>then press enter</small></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),m=document.getElementById('m'),s=document.getElementById('s'),n=document.getElementById('n');
const tc=['#7c3aed','#a855f7','#9333ea','#c026d3','#8b5cf6','#6d28d9'],hc=['#ff6fa5','#f43f8e','#e879f9'];
const ease=t=>1-Math.pow(1-t,3),back=t=>1+3.2*Math.pow(t-1,3)+2.2*Math.pow(t-1,2);
let W,H,F=[];
const mk=(u,h,d,heart)=>({u,h:Math.max(.12,h),d,heart,sd:Math.random()<.5?-1:1,r:Math.min(W,H)*(.05+Math.random()*.025)*(heart?1.3:1),c:(heart?hc:tc)[Math.floor(Math.random()*(heart?3:6))]});
function size(){const k=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*k;c.height=H*k;g.setTransform(k,0,0,k,0,0);}
size();addEventListener('resize',size);
n.onkeydown=e=>{
  if(e.key!=='Enter'||!n.value.trim())return;
  m.textContent=n.value.trim()+', you make everything around me bloom';
  s.style.opacity=0;s.style.pointerEvents='none';n.blur();
  const t0=performance.now()/1000;
  for(let i=0;i<10;i++)F.push(mk((i+.5)/10+(Math.random()-.5)*.04,.22+Math.random()*.3,t0+.2+Math.random()*2.5,i%3==2));
};
c.onclick=e=>F.length&&F.push(mk(e.clientX/W,(H-e.clientY)/H,performance.now()/1000,Math.random()<.35));
function draw(ts){
  const t=ts/1000;let done=true;g.clearRect(0,0,W,H);
  for(const f of F){
    const a=Math.min(1,Math.max(0,(t-f.d)/1.4)),b=Math.min(1,Math.max(0,(t-f.d-1.2)/.9));
    if(b<1)done=false;
    const x=f.u*W,y=H-f.h*H*ease(a),L=H-y,sw=Math.sin(t*1.2+f.u*9)*.06*b;
    g.fillStyle='#4f9a70';g.beginPath();g.moveTo(x,H);g.quadraticCurveTo(x+f.sd*70,H-L*.4,x+f.sd*25,H-L*.7);g.quadraticCurveTo(x+f.sd*5,H-L*.4,x,H);g.fill();
    g.strokeStyle='#3d7a5a';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(x,H);g.quadraticCurveTo(x-15,H-L/2,x,y);g.stroke();
    if(b>0){
      g.save();g.translate(x,y);g.rotate(sw);const R=f.r*back(b);g.fillStyle=f.c;g.beginPath();
      if(f.heart){
        g.moveTo(0,0);g.bezierCurveTo(-R*1.6,-R*1.1,-R*.6,-R*2.1,0,-R*1.2);g.bezierCurveTo(R*.6,-R*2.1,R*1.6,-R*1.1,0,0);g.fill();
        g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-R*.55,-R*1.25,R*.25,R*.13,-.6,0,7);g.fill();
      }else{
        g.moveTo(0,0);g.bezierCurveTo(-R*1.2,-R*.1,-R*1.1,-R,-R*.7,-R*1.5);g.lineTo(-R*.3,-R*.95);g.lineTo(0,-R*1.6);g.lineTo(R*.3,-R*.95);g.lineTo(R*.7,-R*1.5);g.bezierCurveTo(R*1.1,-R,R*1.2,-R*.1,0,0);g.fill();
        g.fillStyle='rgba(255,255,255,.2)';g.beginPath();g.ellipse(0,-R*.75,R*.45,R*.8,0,0,7);g.fill();
      }
      g.restore();
    }
  }
  if(F.length&&done)m.classList.add('on');
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
